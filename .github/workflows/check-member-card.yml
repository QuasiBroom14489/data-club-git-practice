name: check-member-card

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-member-card:
    name: check-member-card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the member card
        # The author login goes through the environment rather than straight into
        # the run line, so nothing from the pull request is interpolated as shell.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check_member_card.sh "$PR_AUTHOR" "$BASE_REF"
